# Jarvis Desktop — local Postgres 16 + pgvector
# Usage: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jarvis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jarvis_pgdata:
